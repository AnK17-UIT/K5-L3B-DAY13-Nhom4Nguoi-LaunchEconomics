# Kế hoạch đề xuất; cần Giám đốc vận hành phê duyệt trước khi chạy pilot.
# Nguồn tính: src/lab13.py, mục B4, D1 và E1.
# Điều chỉnh sau phản biện ngày 2026-11-25: duyệt 100%, ngân sách đầu kỳ và phạm vi ngưỡng CPS.
pilot:
  status: proposed_pending_approval
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại 12 depot LogiX-VN; loại quoc_te và doi_tac. Mẫu tham chiếu 982 yêu cầu/900 thành công; CPS 3.413,90 đ simulated chưa gồm cố định và làm thay. Chi phí theo loại 2.695,64 và 8.220,73 đ simulated."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    seed: 20261125
    stratification: "Theo depot; khóa danh sách 40 staff_id trước phân bổ, cân bằng 20 can thiệp và 20 đối chứng bằng ngẫu nhiên có ràng buộc. Lưu roster, seed và assignment_version trước thu thập."
    control_workflow: "Nhân viên tự xử lý, không mở trợ lý; đối chứng cùng ngày, cùng phạm vi, cùng depot."
    owner: "PM trợ lý hoàn phí"
  rollout: [0.10, 0.25, 0.50]
  schedule:
    start_date: "2026-11-30"
    stage_010: "2026-11-30 đến 2026-12-06: 4 nhân viên can thiệp, duyệt 100% trước gửi khách hoặc ghi hoàn phí; chỉ kiểm tra an toàn"
    stage_025: "2026-12-07 đến 2026-12-13: 10 nhân viên can thiệp, chỉ kiểm tra an toàn"
    stage_050: "2026-12-14 đến 2026-12-27: 20 can thiệp và 20 đối chứng; chỉ cohort tạo trong giai đoạn này vào phân tích chính"
    maturation: "Theo dõi cohort cuối đến 2027-01-03, dành 24 giờ cho dữ liệu đến muộn; chốt 2027-01-05"
    condition: "Chỉ bắt đầu khi sửa khóa chống trùng, bật đủ event, khóa roster và được ký duyệt cả ngân sách. Các ngày là dự kiến: chưa đủ dữ liệu an toàn thì giữ nguyên bước, không giảm duyệt; dịch các giai đoạn sau và ngày quyết định trước khi thu cohort chính, duyệt lại ngân sách nếu kéo dài."
  review_policy:
    owner: "Trưởng nhóm CSKH"
    stage_010_review_share: 1.0
    stage_025_default_review_share: 1.0
    before_execution: "Nhân viên kiểm 100% gợi ý, số tiền và chính sách trước khi gửi khách hoặc ghi lệnh hoàn phí. Chưa có staff_review_decision hợp lệ thì chặn gửi và ghi sổ; lỗi hệ thống duyệt thì chuyển làm tay."
    immediate_checks: "Bật khóa chống trùng và đối soát sổ cái từ ngày đầu; phát hiện hoàn trùng thì khóa ghi ngay theo luật dừng, không chờ mở lại 7 ngày. Duyệt tay giảm rủi ro nhưng không bảo đảm không có lỗi."
    advancement_gate: "Chưa tăng rollout hoặc giảm duyệt khi chưa có ít nhất 100 yêu cầu trưởng thành mỗi arm, chưa hoàn tất 3 lần kiểm tra an toàn hằng ngày liên tiếp, còn luật dừng đang chạm hoặc chưa có mẫu kiểm toán 100 yêu cầu với sai tiền không quá 1%. Giảm duyệt còn cần sửa cộng bỏ dưới 15%, kế hoạch tỉ lệ cụ thể được Trưởng nhóm CSKH đề xuất và Giám đốc vận hành ký trước khi đo cohort chính."
    final_stage: "Giữ cố định tỉ lệ duyệt đã được ký trong cohort chính; không hạ tỉ lệ chỉ để tránh ngưỡng chi phí 8.000 đ. Không đạt điều kiện giảm thì giữ duyệt 100% và chấp nhận kết luận chưa hiệu quả kinh tế."
  initial_budget:
    status: proposed_pending_approval
    owner: "Giám đốc vận hành LogiX-VN"
    purpose: "Ngân sách học thử và kiểm chứng an toàn, chưa cam kết tiết kiệm so với làm tay."
    stage_010_ceiling_vnd: 22000000
    stage_025_ceiling_vnd: 38000000
    total_ceiling_vnd: 60000000
    estimate_label: simulated
    estimated_stage_010_total_vnd: 19970982.45
    estimated_stage_025_total_vnd: 35927456.12
    calculation: "Mỗi bước 7 ngày; lượng yêu cầu tổng = 45.000/30 × 7 × rollout; thành công trong phạm vi = lượng tổng × 900/1.200; CPS B4 100% duyệt, làm lại 15,3 phút = 12.414,79 đ. Cộng làm thay = lượng tổng × 82/1.200 × 12.000 đ và toàn bộ cố định 40.000.000 × 7/30 mỗi tuần. Kết quả 19,97 và 35,93 triệu đ; làm tròn trần đề xuất lên 22 và 38 triệu đ (simulated)."
    exclusions: "Chỉ dự toán phần can thiệp trong phạm vi và toàn bộ cố định; chưa gồm chi phí vận hành thường lệ của đối chứng và yêu cầu ngoài phạm vi, hay chi phí triển khai phát sinh. Đây là dự toán theo cơ cấu mẫu, không phải số chi thực tế."
    approval: "Phải ký trần và phạm vi chi trước ngày bắt đầu; chưa được ký thì chưa chạy. Người kiểm số cập nhật phút và chi thực tế hằng ngày; chi phát sinh ngoài phạm vi phải được duyệt riêng. Kéo dài bước cần duyệt lại ngân sách trước khi tiếp tục."
  cost_guardrail:
    applies_from_rollout: 0.50
    variable_cps_limit_vnd: 8000
    consecutive_complete_weeks: 2
    initial_stage_policy: "Bước 10% và 25% chịu trần ngân sách đầu kỳ đã ký, không dùng ngưỡng CPS 8.000 đ để tự động dừng giai đoạn học thử. Mọi luật an toàn vẫn áp dụng từ ngày đầu theo cửa sổ dữ liệu tương ứng."
    measurement: "Chỉ dùng chi phí biến đổi từ phút đo thật và cohort đã đủ 7 ngày; đánh giá hai tuần hoàn chỉnh của bước 50% sau khi dữ liệu trưởng thành, không gộp tuần đầu vào phép kiểm. Báo riêng chi phí cố định và phần nhân viên làm thay."
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    requests_per_cluster: 299
    raw_requests_per_arm: 5980
    effective_requests_per_arm: 859.1954
    icc: 0.02
    baseline_source: "Giả định đề bài; 82,83% mẫu chạy thử không phải bằng chứng tác động."
    analysis: "ITT theo staff_id phân bổ ban đầu; tính hiệu ứng và khoảng tin cậy hai phía 95%, hiệu chỉnh cụm staff và phân tầng depot; chỉ kết luận khi đủ cohort trưởng thành."
    insufficient_sample: "Không đủ 20 cụm mỗi nhánh hoặc dưới 299 yêu cầu/cụm: báo chưa đủ bằng chứng, không kết luận Go dựa trên p-value danh nghĩa."
  sample_size_checks:
    request_mde_005: 1251
    staff_m75_design_effect: 2.48
    staff_m75_n_per_arm: 3103
    staff_m75_people_per_arm: 42
    staff_m75_total_people: 84
    staff_20_effective_upper_bound: 1000
    depot_6_effective_upper_bound: 300
    mde_006_n_per_arm: 859
    mde_006_min_requests_per_staff: 299
    power_if_true_effect_005: 0.6417
    accepted_tradeoff: "Với 40 nhân viên không đủ cho MDE 5 điểm; đề xuất MDE 6 điểm, power chỉ 0,6417 khi tác động thật 5 điểm; Giám đốc vận hành phải ký chấp nhận."
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm cùng thời gian và depot với 20 nhân viên can thiệp ở giai đoạn cuối."
    randomization: "Bốc thăm bằng code với seed 20261125 ghi trước, phân tầng theo depot; không để quản lý hay nhân viên tự chọn nhóm."
    spillover_risk: "Có thể chia sẻ câu trả lời; giới hạn quyền theo tài khoản và ghi agent_workspace_opened ở cả hai arm; báo tỉ lệ đối chứng mở trợ lý."
    predeclared: "Khóa phạm vi, roster, seed, MDE, chỉ số, cửa sổ, luật dừng, kế hoạch phân tích và ngày quyết định trước ngày bắt đầu."
    minimum_clusters: "20 cụm staff mỗi nhánh; không chọn 6 cụm depot."
  safety_baseline:
    reopen_all: 0.0425
    reopen_scope: 0.03971487
    reopen_difference_vs_control_limit: 0.02
    reopen_absolute_limit: 0.06
    maturity: "Chỉ dùng cohort đã đủ 7 ngày; tuần đầu theo dõi thêm sổ cái và hoàn trùng tức thời, không coi cohort non là an toàn."
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của can thiệp cao hơn đối chứng từ 2 điểm phần trăm hoặc vượt 6%, trên cohort trưởng thành có ít nhất 100 yêu cầu mỗi arm TRONG 3 lần kiểm tra hằng ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển luồng thủ công KHÔNG THÌ không được tăng rollout khi thiếu mẫu hoặc chưa hoàn tất điều tra cảnh báo"
    - "NẾU có từ 1 ca hoàn trùng được xác nhận từ sổ cái TRONG bất kỳ lần đối soát liên tục nào THÌ Kỹ sư trưởng agent khóa ghi hoàn phí ngay và Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được bật lại trước khi đối soát xong và kiểm chứng khóa chống trùng"
    - "NẾU CPS biến đổi trong phạm vi ở bước 50% vượt 8.000 đ tính từ phút nhân viên đo thật trên cohort trưởng thành TRONG 2 tuần hoàn chỉnh liên tiếp của riêng bước 50% THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy trong 1 ngày KHÔNG THÌ không được mở thêm hang_nang hoặc tăng rollout khi chưa xác minh đủ log chi phí"
    - "NẾU tỉ lệ sửa cộng bỏ vượt 40% trên ít nhất 30 yêu cầu đã xem lại TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và giữ nguyên rollout KHÔNG THÌ không được chuyển bước cho đến khi có phương án sửa và số đo tuần kế tiếp"
    - "NẾU sai tiền kiểm toán vượt 1% trên mẫu 100 yêu cầu đã hoàn TRONG 1 tuần THÌ Kế toán trưởng đối soát và Giám đốc vận hành dừng ghi hoàn tự động trong 30 phút KHÔNG THÌ không được giảm xem lại khi chưa đủ mẫu hoặc chưa xử lý sai lệch"
    - "NẾU chi thực tế lũy kế bước 10% đạt trần đã ký (đề xuất 22 triệu đ) hoặc bước 25% đạt trần đã ký (đề xuất 38 triệu đ), hoặc chưa có ngân sách được ký TRONG lần đối soát ngân sách hằng ngày THÌ PM trợ lý hoàn phí dừng phát sinh lượt trợ lý mới trong ngày, chuyển yêu cầu sang làm tay và báo Giám đốc vận hành KHÔNG THÌ không được tăng rollout, kéo dài bước hay chi thêm khi chưa được duyệt lại"
  interim_looks: "Chỉ kiểm tra an toàn và vận hành; không kiểm định hay công bố chỉ số chính ở giữa kỳ."
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý trong 30 phút; Kỹ sư trưởng agent khóa ghi sổ khi nghi hoàn trùng; yêu cầu đang xử lý chuyển nhân viên kèm tóm tắt, đối soát khóa idempotency trước ghi lại."
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Toàn bộ CSV do đề bài giả lập, không phải giao dịch thật."
    - "phut_xem_lai_simulated và phut_lam_lai_simulated; thay bằng phút đo thật sau tuần đầu."
    - "Token 26/130 đ mỗi 1.000 token, tool 15 đ/lượt, lương 2.000 đ/phút: giả định lab."
    - "6 phút/yêu cầu làm tay = 12.000 đ; cố định 40 triệu đ/tháng; 45.000 yêu cầu/tháng: giả định lab."
    - "B4 xem lại 5 phút; làm lại 9 hoặc 15,3 phút: simulated, CPS 11.742,79 hoặc 12.414,79 đ, chưa gồm cố định và làm thay."
    - "Baseline 0,70, ICC 0,02 và MDE 0,06 là giả định thiết kế, cần kiểm chứng."
    - "Dự toán ngân sách học thử 19,97 triệu đ bước 10% và 35,93 triệu đ bước 25%, trần đề xuất 22 và 38 triệu đ; tổng trần 60 triệu đ: simulated, chưa được phê duyệt."
